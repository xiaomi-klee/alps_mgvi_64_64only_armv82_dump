device: klee
enableShutdownFunc: true

positions:
  important_info:
    size: 150
    x: 10
    y: 10
  expand_info:
    size: 150

import_info:
  # PCB SN
  - type: property
    name: pcb_sn
    key_name: a
    command: ro.ril.oem.sno

  # Battery level
  - type: battery
    name: battery_level
    key_name: b

  # MEID, if the phone supports CDMA, it must have the value
  - type: telephony
    name: meid
    key_name: g

  # Factory ID
  - type: property
    name: factory_id
    key_name: o
    command: ro.ril.factory_id

  # Software version
  - type: software_version
    name: software_version
    key_name: v

  - type: battery
    name: battery_df_chemid
    key_name: dc
    params:
      fg1_chemid: chemid
      fg1_df_check: df_check
    
check_info:
  # Secure boot status
  - type: property
    name: secure_boot
    key_name: a
    command: ro.boot.secureboot
    pass_value: 1

  # Whether the bootloader lock is locked
  - type: property
    name: bootloader_lock
    key_name: b
    command: ro.boot.verifiedbootstate
    pass_value: green

  # RPMP provision
  - type: property
    name: rpmp
    key_name: c
    command: vendor.sys.rpmb_state
    pass_value: 22

  # Speaker calibrate status check
  - type: property
    name: speaker_calibrate
    key_name: e
    command: vendor.audio.chk.cal.spk
    pass_value: 1
    
  - type: property
    name: ultrasonic_calibrate
    key_name: f
    command: vendor.audio.chk.cal.us
    pass_value: 1

  # Hardware version
  - type: property
    name: hardware_version
    key_name: m
    command: ro.boot.hwlevel
    pass_value: MP

  # Battery encryption check
  - type: battery
    name: battery_encryption
    key_name: y
    pass_value: 11
    params:
      chip: /sys/class/power_supply/bms/chip_ok
      authentic: /sys/class/power_supply/bms/authentic

  # Camera calibrate status check
  - type: property
    name: camera_calibrate
    key_name: u
    command: vendor.camera.sensor.mi.databin.existmask
    pass_value: 1

  # Debug policy
  - type: property
    name: debug_policy
    key_name: l
    command: ro.boot.dp
    pass_value: "0x20"

  # Security Key: IFAA
  - type: security
    name: ifaa
    key_name: g

  # Airplane mode check
  - type: modem
    name: airplane_mode
    key_name: Y
    command: settings get global airplane_mode_on
    pass_value: 0

  # NFC function check
  - type: nfc
    name: nfc
    key_name: B
    params:
      india_check: true

  # Screen calibrate check
  - type: property
    name: screen_calibrate
    key_name: x
    command: vendor.display.panel.calibration.status
    pass_value: 0

  # Check for residual test pictures
  - type: picture
    name: picture
    key_name: p


  # Sensor calibrate status check
  - type: sensor
    name: sensor
    key_name: z
    params:
      GL: 11111
      CN: 1111
      IN: 1111
      DEFAULT: 1111
  
  # SIM card status
  - type: property
    name: sim_card
    key_name: o
    command: gsm.sim.state
    pass_value: ABSENT,ABSENT

  # SIM Tray
  - type: file
    name: sim_tray
    key_name: s
    command: /sys/devices/platform/odm/odm:simtray/status
    pass_value: 1
    

  - type: recovery
    name: 1217
    key_name: G

  # 小米账号残留
  - type: account
    name: mi_account
    key_name: T

  # shipmode
  - type: ship_mode
    name: ship_mode
    key_name: K

  # Device ID
  - type: property
    name: idmgr_device_id
    key_name: ss
    command: persist.vendor.sys.idmgr.attestation.status
    pass_value: true

  # Sec ID
  - type: property
    name: idmgr_secid
    key_name: sec
    command: persist.vendor.sys.idmgr.secid.status
    pass_value: true

  - type: property
    name: ese_id
    key_name: se
    command: persist.vendor.sys.idmgr.attestation.se.status
    params:
      IN: true
      GL: true
      CN: N

  # battery first usage date
  - type: battery
    name: battery_first_usage_date
    key_name: bf
    pass_value: "00000000"

  # 设备可查找状态
  - type: find_device
    name: find_device
    key_name: fd  
    
expand_info:
  # Phone SN
  - type: property
    name: phone_sn
    key_name: c
    command: ro.ril.oem.psno

  # System image version
  - type: property
    name: version
    key_name: d
    command: ro.mi.os.version.incremental

  # IMEI1
  - type: telephony
    name: imei1
    key_name: e

  # IMEI2
  - type: telephony
    name: imei2
    key_name: f

  # Bluetooth address
  - type: address
    name: bluetooth_address
    key_name: h
    command: ro.ril.oem.btmac

  # WiFi address
  - type: address
    name: wifi_address
    key_name: i
    command: ro.ril.oem.wifimac

  # CPU id
  - type: property
    name: cpu_id
    key_name: k
    command: ro.boot.cpuid

  # Storage id
  - type: storage
    name: storage_id
    key_name: l
    params:
      storage_id_path: /sys/class/mi_memory/mi_memory_device/ufshcd0/dump_string_desc_serial

  # tzProvision
  - type: security
    name: tz_key
    key_name: m

  # Hardware version
  - type: property
    name: hardware_version
    key_name: n
    command: ro.boot.hwversion

  # Maximum CPU frequency
  - type: cpu_frequency
    name: cpu_frequency
    key_name: p
    params:
      core_number: 8
      useHz: true

  # Memory size
  - type: storage
    name: memory_size
    key_name: q

  # Storage size
  - type: storage
    name: storage_size
    key_name: r

  # Project code
  - type: project_name
    name: project_name
    key_name: s
    params:
      klee: P10

  # MIUI cust image version
  # Optional
  - type: property
    name: cust_version
    key_name: T
    command: ro.miui.business.version

  
  # wallpaper color
  - type: property
    name: wallpaper_color
    key_name: u
    command: vendor.wallpaper.color.flag

  # CTA code
  - type: property
    name: cta_code
    key_name: j
    command: ro.ril.oem.ctacode
